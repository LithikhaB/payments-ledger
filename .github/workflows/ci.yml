name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest   # has Docker, so Testcontainers works out of the box
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build and run all tests
        run: chmod +x mvnw && ./mvnw -B verify
